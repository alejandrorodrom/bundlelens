name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the sections below so we can reproduce the issue.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Output of `npm ls bundlelens` or `bundlelens --version`
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node -v`
      placeholder: "v22.x"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal config and commands that trigger the bug
      placeholder: |
        1. Create bundlelens.config.json with …
        2. Run `npx bundlelens run`
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant CLI logs
    validations:
      required: true
